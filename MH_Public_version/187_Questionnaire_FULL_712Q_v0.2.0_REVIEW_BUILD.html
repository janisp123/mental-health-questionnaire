eedbackVersionLabel":"Anketas versija","feedbackContactLabel":"Projekta kontaktadrese","feedbackNone":"Nav atzīmēta neviena jautājuma piezīme.","legalBody":"Anketa darbojas bez interneta, neveic analītiku un automātiski nenosūta atbildes. Atbildes paliek atvērtajā anketā; lai tās nepazaudētu pārtraukuma laikā, saglabā progresu failā. Failu vari glabāt savā tālrunī vai datorā. Tas nav šifrēts un var saturēt privātas veselības atbildes, tāpēc kopīgo to tikai ar cilvēkiem, kuriem uzticies, vai veselības aprūpes speciālistiem. Neievieto to sociālajos tīklos vai citviet publiski.\n\nAnketā apzināti lietota mierīga un saudzīga valoda, lai jautājumi nebiedētu un būtu vieglāk aizpildīt anketu un vērsties pie speciālista.\n\nAtsauksmes par jautājumiem kopē atsevišķi; tās nesatur medicīniskās atbildes. Neiekļauj komentāros savu vārdu vai citus personas datus. Anketa paredzēta tehniskai profesionālai pārskatīšanai. Tā nav klīniski validēta un nenosaka diagnozi.","chooseAllAndContinue":"Atlasīt visas sadaļas un turpināt","continueSelected":"Turpināt ar atlasītajām sadaļām","backupWarning":"Ja progress nav saglabāts failā, pārlūka aizvēršana, zvans vai cits pārtraukums var to pazaudēt. Ja vēlies paņemt pauzi, vispirms saglabā progresu failā.","sectionProgress":"{total} jautājumi · pabeigti: {completed}","noSectionsSelected":"Atzīmē vismaz vienu sadaļu vai izvēlies visas sadaļas.","reportCountSelected":"Atlasītie jautājumi","reportCountDone":"Pabeigtie jautājumi","reportCountSkip":"Izlaistie jautājumi","reportName":"Vārds, uzvārds","reportDate":"Datums","medicine":{"help":"Katrām zālēm pievienojiet atsevišķu ierakstu. Iekļaujiet būtiskas agrāk lietotas zāles arī tad, ja pašlaik nelietojat nevienas. Pārrakstiet informāciju no iepakojuma vai rakstiet “nezinu”; neminiet. Uztura bagātinātāji šeit nav jāuzskaita. Pārmaiņas saglabājas tikai pēc “Saglabāt un tālāk”. Ja nav pievienojamu detaļu, izlaidiet jautājumu.","add":"Pievienot citas zāles","remove":"Noņemt šo ierakstu","discussion" d time.”","supportLink":"Talk to someone · 116123","supportMenu":"Support","emergencyBody":"If you or someone else is in immediate danger, call 112 for emergency assistance. The support line does not replace emergency help.","dismissSupport":"Close message","tools":"File and questionnaire actions","guideTitle":"How to use this questionnaire","guideBody":"Open the downloaded HTML file in a browser; it will not work in preview mode. A single choice is saved in the open questionnaire; for multiple choices or text, press “Save & Next”. Save progress to a file before taking a break. You can keep the file on your phone or computer. It is not encrypted, so share it only with people you trust or healthcare professionals. Do not post it on social media or anywhere public. You decide what to discuss with a professional. For an accuracy review, skip questions that seem fine; flag questions that seem incorrect or unclear and choose a reason. At the end, prepare the report and select “Print / save PDF” to return it for review.","notesTitle":"Latest changes","notesBody":"Last changes: 08.11.2026 12:59 Riga time — simplified the Feedback and acknowledgements section to the contact line.","coverageNote":"Counts cover applicable questions. Answers hidden by changed conditions remain in the saved file but are not included here.","autoHint":"Choose one answer to save it in the open questionnaire and continue.","feedbackFlag":"Suggest a correction to this question","feedbackFlagged":"Feedback added","feedbackTitle":"Suggest a correction","feedbackQuestion":"The question is incorrect or unclear","feedbackLanguage":"Grammar or translation issue","feedbackAnswerPrefix":"Incorrect answer","feedbackOther":"Something else","feedbackComment":"Comment (optional)","feedbackContinue":"Save & Continue","removeFeedback":"Remove flag","feedbackChooseReason":"Choose at least one reason.","feedbackPrivacy":"Only report an issue with the question here. Do not include your name, personal details, or answers.","feedbackProjectCopy":"Copy feedback for the project","feedbackProjectHeading":"Questionnaire feedback","feedbackSectionHeading":"Question feedback","feedbackReasonLabel":"Reason","feedbackVersionLabel":"Questionnaire version","feedbackContactLabel":"Project contact","feedbackNone":"No question feedback has been marked.","legalBody":"The questionnaire works offline, uses no analytics and does not send answers automatically. Answers remain in the open questionnaire; save progress to a file to keep them if you need to pause. You can keep the file on your phone or computer. It is not encrypted and may contain private health answers, so share it only with people you trust or healthcare professionals. Do not post it on social media or anywhere public.\n\nThe questionnaire deliberately uses calm, gentle language so its questions feel less intimidating and people may find it easier to complete it and seek professional help.\n\nQuestion feedback is copied separately and does not contain medical answers. Do not include your name or other personal details in comments. This build is for technical professional review; it is not clinically validated and does not diagnose.","chooseAllAndContinue":"Select all sections and continue","continueSelected":"Continue with selected sections","backupWarning":"If progress has not been saved to a file, closing the browser, taking a call or another interruption may cause it to be lost. Save progress to a file before taking a break.","sectionProgress":"{total} questions · completed: {completed}","noSectionsSelected":"Select at least one section, or choose all sections.","reportCountSelected":"Selected questions","reportCountDone":"Completed questions","reportCountSkip":"Skipped questions","reportName":"Name and surname","reportDate":"Date","medicine":{"help":"Add a separate entry for each medication. Include any relevant past medications, even if you are not currently taking any. Copy the information from the package or write “don’t know”; do not mention. Dietary supplements do not need to be listed here. Changes are only saved after “Save and continue.” If there are no details to add, skip the question.","add":"Add other medications","remove":"Remove this entry","discussion":"What would you like to ask your psychiatrist about medication? (optional)","empty":"Please enter at least one detail or skip the question.","limit":"You can add up to 50 medication records.","select":"Enter only what you know. All fields are optional.","entry":"Medicine","notes":"Questions for a psychiatrist","fields":{"name":"Exact name of the medicine","status":"Current or past medications","strength":"Strength/shape, if known","dose":"Actual amount used at one time","schedule":"How often and when do you use it (also as needed)","duration":"How long have you been taking it/approximate start date","doseDuration":"How long have you been taking this dose?","reason":"What do you use it for?","benefit":"Did this medicine help?","effects":"What improved, worsened, or caused side effects?","changes":"Symptoms or changes after starting, changing, skipping, or stopping medication; timing, if known","stoppedWhen":"When and how you stopped (immediately/gradually), if applicable","stopReason":"Why did you stop, if applicable?"},"status":{"current":"Currently using","past":"I used it before / stopped using it","unknown":"I don't know / I'm not sure"},"benefits":{"A":"Marked improvement","B":"Slight improvement","C":"No noticeable changes","D":"Worsened","E":"It's too early to judge.","F":"I'm not sure.","G":"I don't want to answer."}}},"ru":{"project":"Подготовка к приёму специалиста по психическому здоровью","statusNote":"Для технической профессиональной проверки · 15 разделов объединяют 48 исходных модулей · 712 вопросов · LV — основной язык; EN/RU — черновики · клиническая проверка не проводилась","intro":"Добро пожаловать. Эта бесплатная анкета поможет Вам подготовиться к разговору со специалистом по психическому здоровью. Отвечай ачают отрицательных ответов.","supportTitle":"Вы не одни.","supportBody":"Даже если кажется, что никто Вас не понимает, есть люди, готовые выслушать. Можно позвонить по номеру 116123 — это один шестизначный номер (да, всего 6 цифр). Звонок бесплатный, поддержка доступна круглосуточно на латышском, английском и русском языках. Служба соблюдает принципы анонимности и конфиденциальности и не уведомляет вашу семью, друзей или работодателя. Человек с доступом к вашему телефону или счёту может увидеть, что Вы звонили. Не нужно готовить речь — можно просто сказать: «Мне сейчас трудно».","supportLink":"Поговорить · 116123","supportMenu":"Поддержка","emergencyBody":"Если Вы или кто-то другой в непосредственной опасности, звоните 112 для экстренной помощи. Линия поддержки не заменяет экстренную помощь.","dismissSupport":"Закрыть сообщение","tools":"Действия с файлом и анкетой","guideTitle":"Как пользоваться анкетой","guideBody":"Откройте скачанный HTML-файл в браузере; в режиме предпросмотра он не работает. Выбор одного ответа сохраняется в открытой анкете; для нескольких ответов или текста нажмите «Сохранить и далее». Перед перерывом сохраните файл с ответами. Файл можно хранить на телефоне или компьютере. Он не зашифрован, поэтому делитесь им только с людьми, которым Вы доверяете, или медицинскими специалистами. Не публикуйте его в социальных сетях и других открытых местах. Вы сами решаете, что обсудить со специалистом. Для проверки точности пропускайте подходящие вопросы; отмечайте вопросы, которые кажутся неверными или неясными, и выбирайте причину. В конце подготовьте отчет и выберите «Печать / сохранить PDF», чтобы отправить его на проверку.","notesTitle":"Последние изменения","notesBody":"Последние изменения: 08.11.2026 12:59, время Риги — в разделе «Отзывы и благодарности» оставлена контактная информация.","coverageNote":"Подсчёт охватывает применимые вопросы. Ответы, скрытые после изменения условий, остаются в файле с ответами, но здесь не учитываются.","autoHint":"Выберите один ответ, чтобы сохранить его в открытой анкете и продолжить.","feedbackFlag":"Предложить исправление вопроса","feedbackFlagged":"Замечание добавлено","feedbackTitle":"Предложить исправление","feedbackQuestion":"Вопрос составлен неверно или непонятен","feedbackLanguage":"Ошибка грамматики или перевода","feedbackAnswerPrefix":"Неверный вариант ответа","feedbackOther":"Другая причина","feedbackComment":"Комментарий (необязательно)","feedbackContinue":"Сохранить и продолжить","removeFeedback":"Удалить отметку","feedbackChooseReason":"Выберите хотя бы одну причину.","feedbackPrivacy":"Укажите здесь только замечание к вопросу. Не добавляйте имя, личные данные или ответы.","feedbackProjectCopy":"Скопировать отзыв для проекта","feedbackProjectHeading":"Замечания об анкете","feedbackSectionHeading":"Замечания к вопросам","feedbackReasonLabel":"Причина","feedbackVersionLabel":"Версия анкеты","feedbackContactLabel":"Контакт проекта","feedbackNone":"Нет отмеченных замечаний к вопросам.","legalBody":"Анкета работает без интернета, не использует аналитику и автоматически не отправляет ответы. Ответы остаются в открытой анкете; чтобы не потерять их во время перерыва, сохраните файл с ответами. Файл можно хранить на телефоне или компьютере. Он не зашифрован и может содержать личные сведения о здоровье, поэтому делитесь им только с людьми, которым Вы доверяете, или медицинскими специалистами. Не публикуйте файл в социальных сетях и других открытых местах.\n\nВ анкете намеренно используется спокойный и мягкий язык, чтобы вопросы меньше пугали и человеку было легче заполнить анкету и обратиться к специалисту.\n\nОтзывы о вопросах копируются отдельно и не содержат медицинских ответов. Не указывайте в комментариях своё имя или другие личные данные. Сборка предназначена для технической профессиональной проверки; она не прошла клиническую проверку и не ставит диагноз.","chooseAllAndContinue":"Выбрать все разделы и продолжить","continueSelected":"Продолжить с выбранными разделам ed","C":"uncertain","D":"refused"},"type":"choice","translations":{"lv":{"title":"Vai esat apzināti nodarījis/-usi dzīvniekam, arī mājdzīvniekam vai savvaļas dzīvniekam, sāpes vai savainojumu? Neskaitiet negadījumus, nepieciešamu veterināro aprūpi, humānu dzīvnieku aprūpi vai tūlītēju aizsardzību pret uzbrukumu.","time":"Jebkurā dzīves laikā. Šī sadaļa apkopo pieredzi sarunai ar ārstu; tā nenosaka, vai cilvēks ir bīstams, un neparedz vardarbību. Pagātnes rīcība, emocionāls nejutīgums, ziņu interese vai nevēlamas domas nav pašreizēja nodoma pierādījums. Ņemiet vērā laiku, kontekstu, atkārtošanos un pašreizējās vajadzības. Ja baidāties, ka varat tūlīt kaitēt kādam vai dzīvniekam, pārtrauciet anketu, attālinieties no iespējamā cietušā un meklējiet tūlītēju palīdzību; ārkārtas situācijā zvaniet 112.","choices":{"A":"Nē","B":"Jā","C":"Nezinu / neesmu pārliecināts/-a","D":"Nevēlos atbildēt"}},"en":{"title":"Have you deliberately caused an animal, including a pet or wild animal, pain or injury? Do not count accidents, necessary veterinary care, humane animal care or immediate protection against an attack.","time":"At any time in your life. This section gathers history for a clinician; it does not determine whether someone is dangerous or predict violence. Past acts, emotional numbness, interest in news or unwanted thoughts are not proof of current intent. Consider timing, context, repetition and current needs. If you fear you may imminently harm someone or an animal, stop the questionnaire, move away from the potential victim and seek immediate help; call 112 or your local emergency number in an emergency.","choices":{"A":"No","B":"Yes","C":"I don't know / I'm not sure","D":"I don't want to answer."}},"ru":{"title":"Вы намеренно причиняли животному, в том числе домашнему или дикому, боль или травму? Не учитывайте несчастные случаи, необходимую ветеринарную помощь, гуманное обращение при уходе за животными или непосредственную защиту от нападения.","time":"За всю жизнь. Этот раздел собирает сведения для врача; он не определяет, опасен ли человек, и не предсказывает насилие. Прошлые поступки, эмоциональное онемение, интерес к новостям или нежелательные мысли не доказывают нынешнего намерения. Учитывайте время, контекст, повторение и текущие потребности. Если боитесь, что можете немедленно навредить человеку или животному, прекратите анкету, отойдите от потенциального пострадавшего и срочно обратитесь за помощью; в экстренной ситуации звоните 112 или по местному экстренному номеру.","choices":{"A":"Нет","B":"Да","C":"Не знаю / нет уверенности","D":"Я не хочу отвечать."}}}},{"id":"M18_14","order":330,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":false,"context":{"id":"M18_13","hideValues":["A","D"]},"choiceCodes":["A","B","C","D","E","F","G","H"],"exclusive":"","incompatible":[],"answerStatus":{"A":"answered","B":"answered","C":"answered","D":"answered","E":"answered","F":"answered","G":"uncertain","H":"refused"},"type":"choice","translations":{"lv":{"title":"Kad pēdējo reizi notika šāda apzināta kaitēšana dzīvniekam?","time":"Laiks kopš pēdējās norādītās epizodes.","choices":{"A":"Pēdējās 24 stundās","B":"Pirms vairāk nekā 24 stundām, bet ne vairāk kā 1 mēneša","C":"Pirms vairāk nekā 1 mēneša, bet ne vairāk kā 1 gada","D":"Pirms vairāk nekā 1 gada, bet ne vairāk kā 5 gadiem","E":"Pirms vairāk nekā 5 gadiem","F":"Tas nav noticis","G":"Neatceros / nezinu","H":"Nevēlos atbildēt"}},"en":{"title":"When did this kind of deliberate harm to an animal most recently happen?","time":"Time since the most recent episode described.","choices":{"A":"Within the past 24 hours","B":"More than 24 hours ago, but no more than 1 month ago","C":"More than 1 month but not more than 1 year ago","D":"More than 1 year ago, but no more than 5 years ago","E":"More than 5 years ago","F":"This has not happened","G":"I don't remember / I don't know","H":"I don't want to answer."}},"ru":{"title":"Когда в последний раз происходило такое намеренное причинение вреда животному?","time":"Время с последнего указанного эпизода.","choices":{"A":"За последние 24 часа","B":"Более 24 часов назад, но не более 1 месяца назад","C":"Более 1 месяца назад, но не более 1 года назад","D":"Более года назад, но не более 5 лет назад","E":"Более 5 лет назад","F":"Такого не было","G":"Я не помню / Я не знаю","H":"Я не хочу отвечать."}}}},{"id":"M18_15","order":331,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":false,"context":{"id":"M18_13","hideValues":["A","D"]},"choiceCodes":["A","B","C","D","E","F"],"exclusive":"","incompatible":[],"answerStatus":{"A":"answered","B":"answered","C":"answered","D":"answered","E":"uncertain","F":"refused"},"type":"choice","translations":{"lv":{"title":"Cik gadu jums bija, kad pirmo reizi šādi kaitējāt dzīvniekam?","time":"Vecums pirmās norādītās epizodes laikā.","choices":{"A":"Mazāk par 12 gadiem","B":"12–17 gadi","C":"18 gadi vai vairāk","D":"Tas nav noticis","E":"Neatceros / nezinu","F":"Nevēlos atbildēt"}},"en":{"title":"How old were you when you first harmed an animal in this way?","time":"Age at the first episode described.","choices":{"A":"Under 12","B":"12–17","C":"18 or older","D":"This has not happened","E":"I don't remember / I don't know","F":"I don't want to answer."}},"ru":{"title":"Сколько Вам было лет, когда Вы впервые причинили животному такой вред?","time":"Возраст при первом указанном эпизоде.","choices":{"A":"Младше 12 лет","B":"12–17 лет","C":"18 лет или старше","D":"Такого не было","E":"Я не помню / Я не знаю","F":"Я не хочу отвечать."}}}},{"id":"M18_16","order":332,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":true,"context":{"id":"M18_13","hideValues":["A","D"]},"choiceCodes":["A","B","C","D","E","F","G","H"],"exclusive":"GH","incompatible":[],"answerStatus":{"A":"answered","B":"answered","C":"answered","D":"answered","E":"answered","F":"answered","G":"uncertain","H":"refused"},"type":"choice","translations":{"lv":{"title":"Kā jūs saprotat savus iemeslus vai apstākļus šīs epizodes laikā? Izvēlieties visu atbilstošo.","time":"Pēdējā norādītā kaitējuma dzīvniekam epizode. Varat izlaist; grafiskas detaļas nav jānorāda.","choices":{"A":"Dusmas / neapmierinātība","B":"Vēlme sodīt vai kontrolēt","C":"Citu cilvēku spiediens vai atdarināšana","D":"Ziņkārība vai seku neizpratne tajā laikā","E":"Vēlme izbaudīt ciešanas vai kaitējumu","F":"Cits iemesls / apstākļi","G":"Neatceros / nezinu","H":"Nevēlos atbildēt"}},"en":{"title":"Looking back at that episode, what reasons or circumstances help explain what happened? Select all that apply.","time":"The most recent animal-harm episode described. You may skip; no graphic details are requested.","choices":{"A":"Anger / frustration","B":"Wanting to punish or control","C":"Pressure from others or copying others","D":"Curiosity or not understanding the consequences at the time","E":"Wanting to enjoy suffering or harm","F":"Other reason / circumstances","G":"I don't remember / I don't know","H":"I don't want to answer."}},"ru":{"title":"Если вспомнить тот случай, какие причины или обстоятельства помогают объяснить произошедшее? Выберите всё подходящее.","time":"Последний указанный эпизод причинения вреда животному. Можно пропустить; подробности травм не нужны.","choices":{"A":"Злость / раздражение","B":"Желание наказать или контролировать","C":"Давление других людей или подражание им","D":"Любопытство или непонимание последствий в то время","E":"Желание получить удовольствие от страдания или вреда","F":"Другая причина / обстоятельства","G":"Я не помню / Я не знаю","H":"Я не хочу отвечать."}}}},{"id":"M18_17","order":333,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":false,"context":null,"choiceCodes":["A","B","C","D"],"exclusive":"","incompatible":[],"answerStatus":{"A":"answered","B": . Unwanted thoughts differ from wanting to act on them.","choices":{"A":"I have not seen such reports / no noticeable effect","B":"Sadness or compassion for victims","C":"Fear / anxiety","D":"Anger about what happened","E":"Emotional numbness or avoiding the news","F":"Unwanted, frightening thoughts of harm that I do not want to act on","G":"Admiration for an attacker or wanting to be like them","H":"Wanting to carry out similar harm myself","I":"Another reaction","J":"I don't know","K":"I don't want to answer."}},"ru":{"title":"Как на Вас повлияли сообщения о насильственных нападениях, например о стрельбе в школах? Выберите всё подходящее.","time":"За последние 28 дней. Ответы не используются для классификации людей. Нежелательные мысли отличаются от желания их осуществить.","choices":{"A":"Не видел(а) таких сообщений / заметного влияния нет","B":"Печаль или сочувствие пострадавшим","C":"Страх / тревога","D":"Злость из-за случившегося","E":"Эмоциональное онемение или избегание новостей","F":"Нежелательные, пугающие мысли о причинении вреда, которые я не хочу воплощать в действия","G":"Восхищение нападавшим или желание быть похожим на него","H":"Желание самому/самой причинить подобный вред","I":"Другая реакция","J":"Я не знаю","K":"Я не хочу отвечать."}}}},{"id":"M18_19","order":335,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":false,"context":null,"choiceCodes":["A","B","C","D"],"exclusive":"","incompatible":[],"answerStatus":{"A":"answered","B":"answered","C":"uncertain","D":"refused"},"type":"choice","translations":{"lv":{"title":"Vai esat izteicis/-usi vai nosūtījis/-usi draudus fiziski kaitēt citam cilvēkam? Neskaitiet skaidri abpusēji saprotamu izdomātu spēli vai lomu tēlojumu.","time":"Pēdējie 12 mēneši.","choices":{"A":"Nē","B":"Jā","C":"Nezinu / neesmu pārliecināts/-a","D":"Nevēlos atbildēt"}},"en":{"title":"Have you made or sent threats to physically harm another person? Do not count make-believe or role-play that both sides clearly understood as such.","time":"Last 12 months.","choices":{"A":"No","B":"Yes","C":"I don't know / I'm not sure","D":"I don't want to answer."}},"ru":{"title":"Высказывали или отправляли ли Вы угрозы физически навредить другому человеку? Не учитывайте вымышленную игру или ролевую ситуацию, которую обе стороны ясно понимали как таковую.","time":"Последние 12 месяцев.","choices":{"A":"Нет","B":"Да","C":"Не знаю / нет уверенности","D":"Я не хочу отвечать."}}}},{"id":"M18_21","order":336,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":true,"context":null,"choiceCodes":["A","B","C","D","E","F","G","H","I"],"exclusive":"AHI","incompatible":[],"answerStatus":{"A":"answered","B":"answered","C":"answered","D":"answered","E":"answered","F":"answered","G":"answered","H":"uncertain","I":"refused"},"type":"choice","translations":{"lv":{"title":"Kas palīdz jums neīstenot vēlmi kaitēt cilvēkam vai dzīvniekam? Izvēlieties visu atbilstošo.","time":"Pašlaik.","choices":{"A":"Šādu vēlmju nav","B":"Aiziešana no konflikta / distances ievērošana","C":"Sazināšanās ar uzticamu cilvēku","D":"Profesionālas palīdzības meklēšana","E":"Pašnomierināšanās paņēmieni vai saskaņots drošības plāns","F":"Bīstamu priekšmetu pieejamības mazināšana ar atbalstu","G":"Citi paņēmieni","H":"Nezinu, kas palīdzētu","I":"Nevēlos atbildēt"}},"en":{"title":"What helps you avoid acting on an urge to harm a person or animal? Select all that apply.","time":"Currently.","choices":{"A":"I do not have such urges","B":"Leaving a conflict / keeping distance","C":"Contacting someone I trust","D":"Seeking professional help","E":"Calming strategies or an agreed safety plan","F":"Reducing access to dangerous items with support","G":"Other steps","H":"I do not know what would help","I":"I don't want to answer."}},"ru":{"title":"Что помогает Вам не действовать под влиянием желания навредить человеку или животному? Выберите всё подходящее.","time":"В настоящее время.","choices":{"A":"Таких желаний нет","B":"Выйти из конфликта / держаться на расстоянии","C":"Связаться с человеком, которому доверяю","D":"Обратиться за профессиональной помощью","E":"Способы успокоиться или согласованный план безопасности","F":"С помощью другого человека ограничить доступ к опасным предметам","G":"Другие способы","H":"Не знаю, что помогло бы","I":"Я не хочу отвечать."}}}},{"id":"M18_22","order":337,"module":"S05","sourceModule":"18","originModule":18,"section":18,"profile":"CUSTOM-HARM-CONTEXT-1","multi":true,"context":{"id":"M18_07","hideValues":["A","D","E"]},"choiceCodes":["A","B","C","D","E","F","G"],"exclusive":"FG","incompatible":[],"answerStatus":{"A":"answered","B":"answered","C":"answered","D":"answered","E":"answered","F":"uncertain","G":"refused"},"type":"choice","translations":{"lv":{"title":"Kādi apstākļi bija pēdējā epizodē, kad apzināti fiziski kaitējāt citam cilvēkam? Izvēlieties visu atbilstošo.","time":"Pēdējā norādītā apzināta fiziska kaitējuma citam cilvēkam epizode.","choices":{"A":"Tūlītēja sevis vai cita aizsardzība pret uzbrukumu","B":"Dusmas vai konflikts","C":"Vēlme sodīt, iebiedēt vai kontrolēt","D":"Citu cilvēku spiediens","E":"Citi apstākļi","F":"Neatceros / nezinu","G":"Nevēlos atbildēt"}},"en":{"title":"What were the circumstances the last time you intentionally caused physical harm to another person? Select all that apply.","time":"The most recent episode of intentional physical harm to another person described.","choices":{"A":"Immediate defence of myself or someone else against an attack","B":"Anger or conflict","C":"Wanting to punish, intimidate or control","D":"Pressure from others","E":"Other circumstances","F":"I don't remember / I don't know","G":"I don't want to answer."}},"ru":{"title":"При каких обстоятельствах Вы в последний раз намеренно причинили физический вред другому человеку? Выберите всё подходящее.","time":"Последний указанный случай намеренного причинения физическ (function (root) {
"use strict";
root.QuestionnaireModel = {
 create(data) {
  const groups=new Map(data.groups.map(group=>[group.id,group]));
  const optionalIds=data.groups.filter(group=>!group.required).map(group=>group.id);
  const byId=Object.create(null),all=[];
  for(const group of data.groups){
   for(const question of group.questions){
    if(byId[question.id])throw Error("Duplicate question: "+question.id);
    byId[question.id]=question;all.push(question);
   }
  }
  function questionVisible(state,question){
   const context=question.context;
   if(!context||!context.id)return true;
   const parent=byId[context.id];
   if(!parent||!questionVisible(state,parent)||
      (!groups.get(parent.module).required&&!state.selected.includes(parent.module)))return false;
   const answer=state.answers[context.id];
   if(!answer||answer.kind!=="choice")return !Array.isArray(context.showValues);
   const chosen=new Set(answer.codes||[]);
   if(Array.isArray(context.showValues)&&!context.showValues.some(value=>chosen.has(value)))return false;
   if(Array.isArray(context.hideValues)&&context.hideValues.some(value=>chosen.has(value)))return false;
   return true;
  }
  const visibleQuestions=state=>all.filter(question=>questionVisible(state,question));
  return {
   groups,optionalIds,byId,all,
   questionVisible,
   reportQuestions:visibleQuestions,
   active(state){return all.filter(question=>(groups.get(question.module).required||state.selected.includes(question.module))&&questionVisible(state,question));},
   current(state){return byId[state.currentId]||null;},
   countGroup(state,groupId){
    const questions=all.filter(question=>question.module===groupId&&questionVisible(state,question));
    return {total:questions.length,done:questions.filter(question=>state.answers[question.id]).length,
     skipped:questions.filter(question=>state.answers[question.id]?.kind==="skip").length};
   },
   isSafety(question){return !!question.safetyRequired;}
  };
 }
};

  if(x.layoutVersion&&x.layoutVersion!==layoutVersion&&!previousLayoutVersions.includes(x.layoutVersion))throw Error("Unsupported layout");
  const answers={};
  for(const [id,record] of Object.entries(x.answers)){
   const q=byId[id];if(!q||!record||typeof record!=="object"||Array.isArray(record))throw Error("Invalid record");
   if(record.kind==="choice"){
    if(q.type==="shortText"||q.type==="medicineList"||!Array.isArray(record.codes)||!record.codes.length||new Set(record.codes).size!==record.codes.length||!record.codes.every(code=>q.choiceCodes.includes(code)))throw Error("Unknown choice");
    if((!q.multi&&record.codes.length!==1)||(q.maxChoices&&record.codes.length>q.maxChoices)||(record.codes.length>1&&record.codes.some(code=>q.exclusive?.includes(code))))throw Error("Invalid single answer");
    if(incompatiblePair(q,record.codes))throw Error("Incompatible answers");

   }else if(record.kind==="text"){
    if(q.type!=="shortText"||typeof record.value!=="string")throw Error("Invalid text");
    answers[id]={kind:"text",value:record.value.slice(0,200),status:"answered",savedAt:record.savedAt||""};
   }else if(record.kind==="medicine"){
    if(q.type!=="medicineList"||!Array.isArray(record.records)||record.records.length>50||typeof record.discussion!=="string"||record.discussion.length>3000)throw Error("Invalid medicine list");
    const statuses=new Set(["current","past","unknown"]),benefits=new Set(["","A","B","C","D","E","F","G"]);
    const records=record.records.map(item=>{
     if(!item||typeof item!=="object"||Array.isArray(item)||Object.keys(item).sort().join(",")!==medicineFields.slice().sort().join(",")||
        !medicineFields.every(key=>typeof item[key]==="string"&&item[key].length<=1000)||
        !statuses.has(item.status)||!benefits.has(item.benefit)||!medicineFields.some(key=>key!=="status"&&item[key].trim()))throw Error("Invalid medicine record");

  }

  const selectedIds=Array.isArray(x.selected)?x.selected.map(id=>optionalIds.includes(id)?id:selectedModuleMap[id]||null):[];

  if(queue!=null&&(!Array.isArray(queue)||new Set(queue).size!==queue.length||queue.some(id=>!byId[id]||!isSafety(byId[id]))))throw Error("Invalid review sequence");

  return {
   answers,feedback:restoredFeedback,selected,sectionConfirmed:!!x.sectionConfirmed,
   reviewQueue,
   reviewReturn:reviewQueue&&["question","report","results"].includes(x.reviewReturn?.screen)?{screen:x.reviewReturn.screen,id:x.reviewReturn.id}:null,
   savedCount:Number.isInteger(x.savedCount)&&x.savedCount>=0?x.savedCount:Object.keys(answers).length,

(function (root) {
"use strict";
root.QuestionnaireFlow = {

  const index=questions.findIndex(question=>question.id===state.currentId),next=questions[index+1];

  if(state.reviewQueue?.[0]===state.currentId){
   state.reviewQueue.shift();

   const previous=state.reviewReturn;
   state.reviewQueue=null;state.reviewReturn=null;
   if(previous?.screen==="question"&&questions.some(question=>question.id===previous.id))return {id:previous.id};
   return {screen:previous?.screen||"results",currentId:previous?.id||null,clearDraft:true};
  }

(function (root) {
"use strict";
root.QuestionnaireEvents = {

  app.addEventListener("click",event=>{
   const choice=event.target.closest(".choice");
   const radio=choice?.querySelector('input[name="answer"][type="radio"]');
   if(radio){if(event.detail<=1)handlers.singleAnswer(radio.value);return;}
   const element=event.target.closest("[data-act]");if(!element)return;
   event.preventDefault();
   if(element.dataset.act==="addMedicine"||element.dataset.act==="removeMedicine"){
    handlers.medicineAction(element.dataset.act,Number(element.dataset.medRemove));return;
   }
   if(element.dataset.jump)handlers.jump(element.dataset.jump);
   else handlers.action(element.dataset.act);
  });
  app.addEventListener("change",event=>{
   const element=event.target;
   if(element.id==="language"){handlers.language(element.value);return;}
   if(element.hasAttribute("data-med-field")){handlers.medicineChange();return;}
   if(element.hasAttribute("data-module")){handlers.moduleChange();return;}
   if(element.id==="restore"){handlers.restore(element.files[0]);return;}
   if(element.name==="answer")handlers.answerChange(event);
  });

   const element=event.target;
   if(element.id==="shortText")handlers.shortTextInput(element.value);
   if(element.hasAttribute("data-med-field"))handlers.medicineChange();
   if(element.id==="medicineDiscussion")handlers.medicineDiscussionInput(element.value);
  });

 advanceAfterSave();
}
function previous(){const destination=flow.previous(state,active());if(destination.id)setQuestion(destination.id);else {state.screen=destination.screen;render();}}
function skipSection(){
 const q=current();if(!q||groups.get(q.module).required)return;
 if(!window.confirm(ui().skipConfirm))return;
 for(const item of all.filter(x=>x.module===q.module&&questionVisible(x))){
  if(!state.answers[item.id])state.answers[item.id]={kind:"skip",savedAt:new Date().toISOString(),status:"skipped"};
 }
 const next=active().find(x=>x.module!==q.module&&all.indexOf(x)>all.indexOf(q));
 if(next)setQuestion(next.id);else{state.screen="results";render();}
}
function skipRest(){if(window.confirm(ui().restConfirm)){state.screen="results";state.draft=null;render();}}
function showSections(m){state.screen="selector";state.sectionDraft=m?[...m]:[...state.selected];state.draft=null;render();}
function confirmSections(){
 if(!state.sectionDraft.length){state.notice=ui().noSectionsSelected;render();return;}
 state.selected=optionalIds.filter(id=>state.sectionDraft.includes(id));state.sectionConfirmed=true;
 state.screen="question";
 const first=active().find(q=>!state.answers[q.id]);
 if(first)setQuestion(first.id);else {state.screen="results";render();}
}
function setDraft(ev){
 const q=current();if(!q||q.type==="shortText"||q.type==="medicineList")return;
 const inp=ev.target;if(inp.name!=="answer")return;
 let codes=(state.draft?.codes||[]).slice();
 if(!q.multi){codes=[inp.value];}else{
  if(inp.checked){
    if((q.exclusive||"").includes(inp.value))codes=[inp.value];
    else{codes=codes.filter(c=>!(q.exclusive||"").includes(c));if(!codes.includes(inp.value))codes.push(inp.value);}
  }else codes=codes.filter(c=>c!==inp.value);
  if(q.maxChoices&&codes.length>q.maxChoices){state.notice=ui().maxChoices+" "+q.maxChoices;codes=codes.filter(c=>c!==inp.value);}
 }
 state.draft={forId:q.id,codes};
 if(q.multi){
  app.querySelectorAll('input[name="answer"]').forEach(el=>el.checked=codes.includes(el.value));
  const message=app.querySelector('.notice');if(message)message.textContent=state.notice;
 }
}
function downloadFile(name,contents,mime){
 const blob=new Blob([contents],{type:mime||"text/plain;charset=utf-8"});
 const href=URL.createObjectURL(blob),link=document.createElement("a");link.href=href;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);
}
function downloadBackup(){
 const payload={schema:"mental-pilot-recovery-v1",version:data.version,layoutVersion:data.layout_version,lang:state.lang,selected:[...state.selected],sectionConfirmed:state.sectionConfirmed,currentId:state.currentId,answers:state.answers,feedback:state.feedback,reviewQueue:state.reviewQueue||null,reviewReturn:state.reviewReturn||null,exportedAt:new Date().toISOString()};
 downloadFile("questionnaire-recovery.json",JSON.stringify(payload,null,2),"application/json");
}
function continueAfterSection(shouldSave){
 const destination=state.pendingSectionEnd;if(!destination)return;
 if(shouldSave){if(destination.id)state.currentId=destination.id;downloadBackup();}
 state.pendingSectionEnd=null;
 state.notice=shouldSave?ui().backupSaved:"";
 if(destination.id){state.currentId=destination.id;state.draft=null;state.feedbackOpen=false;state.screen="question";render();window.scrollTo(0,0);return;}
 state.currentId=destination.currentId??state.currentId;state.screen=destination.screen||"results";state.draft=null;render();window.scrollTo(0,0);
}
function restore(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  try{
   const x=JSON.parse(String(reader.result));
   const restored=window.QuestionnaireRecovery.validate(x,{byId,optionalIds,legacyOpeningGroups:data.legacy_opening_groups,
    layoutVersion:data.layout_version,previousLayoutVersions:data.previous_layout_versions,
    selectedModuleMap:data.source_module_to_section,medicineFields,choiceStatus,incompatiblePair,isSafety});
   if((Object.keys(state.answers).length||Object.keys(state.feedback).length)&&!window.confirm(ui().replaceSession))return;
   state.reviewQueue=restored.reviewQueue;
   state.reviewReturn=restored.reviewReturn;
   state.answers=restored.answers;
   state.feedback=restored.feedback;state.feedbackOpen=false;
   state.selected=restored.selected;
   state.sectionConfirmed=restored.sectionConfirmed;
   state.support=null;state.supportSeen=[];
   if(restored.lang)state.lang=restored.lang;
   state.currentId=restored.currentId;
   if(state.reviewQueue)state.currentId=state.reviewQueue[0];
   const pending=active().find(q=>groups.get(q.module).required&&!state.answers[q.id]);
   if(pending&&state.currentId&&!groups.get(byId[state.currentId].module).required)
     state.currentId=pending.id;
   if(!active().some(q=>q.id===state.currentId))state.currentId=active().find(q=>!state.answers[q.id])?.id||null;
   state.screen=state.currentId?"question":"start";state.draft=null;state.notice=ui().restoreOK;render();
  }catch(err){state.notice=ui().restoreError;render();}
 };
 reader.onerror=function(){state.notice=ui().restoreError;render();};
 reader.readAsText(file,"utf-8");
}
async function copyText(text,sourceId="reportText"){
 const area=document.getElementById(sourceId);
 if(area){area.value=text;area.focus();area.select();}
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);state.notice=ui().copied;}
  else if(area&&document.execCommand("copy"))state.notice=ui().copied;
  else state.notice=ui().copyFailure;
 }catch(e){state.notice=ui().copyFailure;}
 const target=document.querySelector('.notice');
 if(target)target.textContent=state.notice;else{const p=document.createElement("p");p.role="status";p.className="notice";p.textContent=state.notice;app.querySelector("header").after(p);}
}
function action(key){
 if(["skip","previous","skipSection","end","sections","results","doctor","resultScreen","back","reviewSafety","new","feedbackContinue"].includes(key))clearPendingSingleAnswer();
 const q=reportQuestions(),u=ui();
 if(key==="support"){state.support="support";state.focusSupport=true;render();window.scrollTo(0,0);return;}
 if(key==="dismissSupport"){state.support=null;render();return;}
 if(key==="start"){start();return;}
 if(key==="all"){state.sectionDraft=[...optionalIds];confirmSections();return;}
 if(key==="confirm"){confirmSections();return;}
 if(key==="cancel"){state.screen=state.currentId?"question":"start";render();return;}
 if(key==="save"){save();return;}
 if(key==="saveAndContinue"){continueAfterSection(true);return;}
 if(key==="continueWithoutSaving"){continueAfterSection(false);return;}
 if(key==="feedback"){state.feedbackOpen=!state.feedbackOpen;state.notice="";render();return;}
 if(key==="feedbackContinue"){
  const currentQuestion=current();if(!currentQuestion)return;
  const reasons=Array.from(app.querySelectorAll('[data-feedback-reason]:checked'),el=>el.dataset.feedbackReason);
  if(!reasons.length){state.notice=ui().feedbackChooseReason;render();return;}
  const comment=(document.getElementById("feedback-comment")?.value||"").trim().slice(0,500);
  state.feedback[currentQuestion.id]={reasons,comment,language:state.lang,version:data.version,updatedAt:new Date().toISOString()};
  state.feedbackOpen=false;state.notice="";
  if(!state.answers[currentQuestion.id])state.answers[currentQuestion.id]={kind:"skip",savedAt:new Date().toISOString(),status:"skipped"};
  advanceAfterSave();
  return;
 }
 if(key==="removeFeedback"){
  if(current())delete state.feedback[state.currentId];state.feedbackOpen=false;state.notice="";render();return;
 }
 if(key==="skip"){skip();return;}
 if(key==="previous"){previous();return;}
 if(key==="skipSection"){skipSection();return;}
 if(key==="end"){skipRest();return;}
 if(key==="sections"){showSections();return;}
 if(key==="results"){state.screen="results";render();return;}
 if(key==="doctor"){state.screen="report";render();return;}
 if(key==="resultScreen"){state.screen="results";render();return;}
 if(key==="back"){state.screen=state.currentId?"question":"start";render();return;}
 if(key==="reviewSafety"){const safety=active().filter(isSafety);if(safety.length){
   state.reviewQueue=safety.map(q=>q.id);
   state.reviewReturn={screen:state.screen,id:state.currentId};
   setQuestion(state.reviewQueue[0]);
  }return;}
 if(key==="new"){
   if(window.confirm(u.newConfirm)){
     const lang=state.lang;state={lang,screen:"start",currentId:null,answers:{},feedback:{},feedbackOpen:false,selected:[],sectionDraft:[],sectionConfirmed:false,notice:"",draft:null};render();
   }return;
 }
 if(key==="backup"){downloadBackup();state.notice=u.backupSaved;render();return;}
 if(key==="print"){
   if(state.screen!=="report"){state.reportView="doctor";state.screen="report";render();}
   window.print();return;
 }
 if(key==="copyFeedback"){
   copyText(report.projectFeedbackText(all,state.feedback,state.lang,data.ui,data.presentation.feedbackContactEmail,data.version),"projectFeedbackSource");return;
 }
}
function singleAnswer(code){
 const q=current();if(!q||q.multi||q.type==="shortText")return;
 if(pendingSingleAnswer?.id===q.id&&pendingSingleAnswer.code===code)return;
 clearPendingSingleAnswer();
 state.draft={forId:q.id,codes:[code]};
 const pending={id:q.id,code,timer:null};
 pendingSingleAnswer=pending;
 render();
 pending.timer=setTimeout(()=>{
  if(pendingSingleAnswer!==pending||current()?.id!==pending.id)return;
  pendingSingleAnswer=null;
  save();
 },1300);
}
window.QuestionnaireEvents.bind(app,{
 singleAnswer,action,
 medicineAction:changeMedicineList,
 jump:moduleId=>{
  const choices=active().filter(q=>q.module===moduleId),next=choices.find(q=>!state.answers[q.id])||choices[0];
  if(next)setQuestion(next.id);
 },
 language:value=>{state.lang=value;state.notice="";render();},
 medicineChange:readMedicineControls,
 moduleChange:()=>{state.sectionDraft=Array.from(app.querySelectorAll("[data-module]:checked"),el=>el.dataset.module);render();},
 restore,
 answerChange:event=>{if(current()?.multi)setDraft(event);else singleAnswer(event.target.value);},
 shortTextInput:value=>{if(current())state.draft={forId:current().id,value};},
 medicineDiscussionInput:value=>{if(state.draft)state.draft.discussion=value;}
});
render();
})();
</script></body></html>
