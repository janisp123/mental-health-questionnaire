name: App Component Checks

on:
  push:
    branches: [develop]
    paths:
      - 'src/app/**'
      - 'tests/app/**'
      - 'tests/full_bank/browser_helpers.py'
      - 'tools/build_questionnaire.py'
      - '.github/workflows/app-components.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-components:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated source and UI components
        run: |
          python tests/app/test_build_manifest.py
          python tests/app/test_ui_catalogs.py
          node tests/app/test_screens.js
          node tests/app/test_question_screens.js
          node tests/app/test_report_screens.js
      - name: Prepare focused browser check
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check synthetic runtime behaviors offline
        run: python tests/app/test_runtime_answers.py
