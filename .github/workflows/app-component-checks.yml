name: App Component Checks

on:
  push:
    branches: [develop]
    paths:
      - 'src/app/**'
      - 'tests/app/**'
      - 'tests/full_bank/browser_helpers.py'
      - 'tools/build_questionnaire.py'
      - '.github/workflows/app-component-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline app source assembly
        run: python tests/app/test_build_manifest.py
      - name: Check interface catalog structure
        run: python tests/app/test_ui_catalogs.py
      - name: Test screen renderers with synthetic content
        run: |
          node tests/app/test_screens.js
          node tests/app/test_question_screens.js
          node tests/app/test_report_screens.js
      - name: Check isolated runtime rules
        run: |
          node tests/app/test_model.js
          node tests/app/test_answer_flow.js
          node tests/app/test_recovery.js
          node tests/app/test_events.js
      - name: Check app JavaScript syntax
        run: |
          for file in src/app/core/*.js src/app/screens/*.js src/app/reports/*.js; do
            node --check "$file"
          done
      - name: Prepare focused browser check
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check synthetic runtime behaviors offline
        run: |
          python tests/app/test_runtime_answers.py
          python tests/app/test_runtime_feedback.py
          python tests/app/test_runtime_recovery.py
          python tests/app/test_runtime_layout.py
