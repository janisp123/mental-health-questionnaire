name: App Component Checks

on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/questionnaire/build.json'
      - 'translations/**'
      - 'tests/app/**'
      - 'tests/full_bank/browser_helpers.py'
      - 'tools/build_questionnaire.py'
      - 'tools/run_checks.py'
      - '.github/workflows/app-component-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare browser tooling
        run: |
          python -m pip install -r tools/review-requirements.txt playwright==1.65.2
          if command -v google-chrome >/dev/null; then
            echo "QUESTIONNAIRE_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Test focused app behaviors in all active languages
        run: python tools/run_checks.py --suite app
