name: Publish approved discovery page
# Manual only: merging this workflow does not publish the site.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated publication artifact
        run: python tests/discovery/test_build.py
      - name: Read owner-enabled Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Build only the discovery page and sitemap
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/build_discovery.py --base-url "$PAGES_BASE_URL" --output dist/discovery-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/discovery-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved page
        id: deployment
        uses: actions/deploy-pages@v4
