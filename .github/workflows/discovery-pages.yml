name: Publish questionnaire website
# Package/source commits alone do not publish ahead of verified Drive delivery.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/discovery-preview/*.html'
      - 'tools/build_discovery.py'
      - '.github/workflows/discovery-pages.yml'
      - 'docs/review/checks/*-drive-sync.json'
permissions:
  contents: read
concurrency:
  group: discovery-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify isolated publication artifact
        run: python tests/discovery/test_build.py
      - name: Read owner-enabled Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Stage landing pages and the verified questionnaire
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/build_discovery.py --base-url "$PAGES_BASE_URL" --output dist/discovery-site --require-verified-distribution
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/discovery-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
