name: Offline Pilot Checks

on:
  push:
    branches: [develop]
    paths:
      - 'src/pilot/**'
      - 'src/modules/**'
      - 'tools/build_pilot.py'
      - 'tools/verify_project_index.py'
      - 'tests/pilot/**'
      - 'project-manifest.json'
      - 'dist/PILOT_offline_LV_EN_RU_v0.2_NOT_RELEASED.html'
      - '.github/workflows/pilot-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify imported original files and modules
        run: python tools/verify_project_index.py
      - name: Verify modular pilot data and offline packaging
        run: python tests/pilot/test_build.py
      - name: Compare active questions and choices against frozen v16
        run: python tests/pilot/test_source_fidelity.py
      - name: Check optional layout and report semantics
        run: |
          python tests/pilot/test_layout.py
          node tests/pilot/test_reports.js
      - name: Check shared JavaScript syntax
        run: |
          node --check src/pilot/core/app.js
          node --check src/pilot/reports/reports.js
      - name: Build prototype single HTML
        run: python tools/build_pilot.py
      - name: Prepare browser for offline journeys
        run: |
          python -m pip install playwright
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "PILOT_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Run real offline browser smoke journey
        run: python tests/pilot/test_browser.py
      - name: Test module and translation independence offline
        run: python tests/pilot/test_independence.py
      - name: Check real section 21 from answering to exported reports
        run: python tests/pilot/test_section21.py
      - name: Upload offline prototype (test artifact, NOT a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PILOT_offline_LV_EN_RU_v0.2_NOT_RELEASED
          path: dist/PILOT_offline_LV_EN_RU_v0.2_NOT_RELEASED.html
          retention-days: 14

