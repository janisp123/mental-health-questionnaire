name: Project Protocol Preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/TD_LIST.md'
      - 'docs/DECISIONS.md'
      - 'docs/AGENT_PROTOCOL.md'
      - 'docs/NEW_PROJECT_SETUP.md'
      - 'tools/check_project_protocol.py'
      - '.github/workflows/project-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check canonical paths and shared agent instructions
        run: python tools/check_project_protocol.py
